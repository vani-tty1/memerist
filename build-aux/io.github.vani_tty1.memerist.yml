app-id: io.github.vani_tty1.memerist
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: memerist
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: imagemagick
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-x
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-36.tar.gz
        sha256: 5ba807e38a6bcb7c3c96a166485e270c5017aaa6b166f0440dc4b2badf6e6167


  - name: memerist
    builddir: true
    buildsystem: meson
    sources:
      - type: dir
        path: ..